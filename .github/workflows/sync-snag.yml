name: Sync snag registry

on:
  push:
    branches: [latest]
    paths: [bin/snag]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute SHA256
        id: hash
        run: echo "sha256=$(sha256sum bin/snag | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update registry snag_sha256
        run: |
          ruby - <<'RUBY'
          require 'json'
          path = 'Formula/registry.json'
          reg  = JSON.parse(File.read(path))
          reg['snag_sha256'] = '${{ steps.hash.outputs.sha256 }}'
          File.write(path, JSON.pretty_generate(reg) + "\n")
          RUBY

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/registry.json
          git diff --cached --quiet || git commit -m "ci: sync snag_sha256 [skip ci]"
          git push
